[[block]]
block = "taskwarrior"
interval = 60
format = " $icon count.eng(w:1) tasks "
format_singular = " $icon 1 task "
format_everything_done = ""
warning_threshold = 10
critical_threshold = 20
[[block.filters]]
name = "today"
filter = "+PENDING +OVERDUE or +DUETODAY"
[[block.filters]]
name = "some-project"
filter = "project:some-project +PENDING"

[[block]]
block = "cpu"
interval = 1
format = " $icon $utilization "
format_alt = " $icon cpu $barchart $utilization "
info_cpu = 20
warning_cpu = 50
critical_cpu = 90


[[block]]
block = "disk_space"
format = " $free.eng(range:..30e9) |"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 200
warning = 20.0
alert = 10.0

[[block]]
block = "memory"
format = " $icon $mem_used_percents.eng(w:1) "
format_alt = " $icon_swap $swap_free.eng(w:3,u:B,p:Mi)/$swap_total.eng(w:3,u:B,p:Mi)($swap_used_percents.eng(w:2)) "
interval = 30
warning_mem = 70
critical_mem = 90

[[block]]
block = "net"
format = " $icon $signal_strength "
format_alt = " $icon {$signal_strength $ssid $frequency|Wired connection} via $device "

[[block]]
block = "bluetooth"
mac = "C4:16:88:A2:DA:D2"
# disconnected_format  = " Ø "
disconnected_format  = " $icon "
format = " $icon "
[block.battery_state]
"0..20" = "critical"
"21..70" = "warning"
"71..100" = "good"

# [[block]]
# block = "battery"
# format = " $icon $percentage "
[[block]]
block = "battery"
format = " $percentage {$time_remaining.dur(hms:true, min_unit:m)|}"
full_format = " $icon "
device = "DisplayDevice"
driver = "upower"

[[block]]
block = "backlight"
format = " $icon $brightness "
# step_width = 3
invert_icons = true
device = "intel_backlight"

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"




[[block]]
block = "music"
format = " $icon {$combo.str(max_w:20) $next |}"
interface_name_exclude = [".*kdeconnect.*", "mpd"]
# format = " $icon {$combo.str(max_w:20,rot_interval:0.5) $play $next |}"
# format_alt = " format 2 "
seek_step_secs = 10
[[block.click]]
button = "left"
action = "play_pause"
[[block.click]]
button = "middle"
widget = "."
action = "toggle_format"

[[block.click]]
button = "up"
action = "volume_up"
[[block.click]]
button = "down"
action = "volume_down"
[[block.click]]
button = "forward"
action = "seek_forward"
[[block.click]]
button = "back"
action = "seek_backward"


[[block]]
block = "custom"
command = " echo $USER "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "


